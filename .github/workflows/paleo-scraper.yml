name: Paleo news scraper

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Mondays 06:00 UTC
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit results back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r paleo-scraper/requirements.txt

      - run: python scraper.py
        working-directory: paleo-scraper
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Commit new articles
        run: |
          cd paleo-scraper
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add paleontology_news.json seen_urls.json
          git diff --staged --quiet || git commit -m "chore(paleo): daily news $(date -u +%F)"
          git push
